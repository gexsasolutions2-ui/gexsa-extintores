<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>GEXSA SOLUTIONS | Ficha Digital</title>

<style>

:root{
  --rojo:#ef111b;
  --azul:#0f5d98;
  --ficha:#eef3f7;
  --gris:#6f8192;
  --texto:#17324d;
  --linea:#d8e1e8;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  background:#fff;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--texto);
}

.contenedor{
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:25px 16px 40px;
}

.logo{
  text-align:center;
  margin-bottom:12px;
}

.logo svg{
  width:200px;
  max-width:70%;
  height:auto;
}

.badge{
  width:max-content;
  margin:15px auto 18px;
  padding:8px 15px;
  border-radius:999px;
  background:#eaf4fb;
  color:var(--azul);
  font-size:13px;
  font-weight:800;
}

h1{
  text-align:center;
  margin:8px 0 5px;
  font-size:30px;
  color:#102f4d;
}

.serie{
  text-align:center;
  margin-bottom:25px;
  color:var(--gris);
  font-size:15px;
  font-weight:800;
}

.ficha{
  background:var(--ficha);
  border-radius:18px;
  padding:15px 18px;
  margin-bottom:20px;
}

.fila{
  padding:10px 0;
  border-bottom:1px solid var(--linea);
}

.fila:last-child{
  border-bottom:none;
}

.etiqueta{
  color:var(--gris);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  margin-bottom:4px;
}

.valor{
  font-size:18px;
  font-weight:800;
  line-height:1.3;
  overflow-wrap:anywhere;
}

.boton{
  display:flex;
  align-items:center;
  width:100%;
  min-height:58px;
  margin:13px 0;
  padding:15px 17px;
  border-radius:14px;
  background:var(--rojo);
  color:#fff;
  text-decoration:none;
  font-size:15px;
  font-weight:800;
  text-transform:uppercase;
}

.icono{
  width:26px;
  min-width:26px;
  margin-right:10px;
  font-size:21px;
}

.texto-boton{
  flex:1;
}

.flecha{
  font-size:28px;
}

.boton-deshabilitado{
  opacity:.45;
}

.cargando{
  background:var(--ficha);
  border-radius:15px;
  padding:22px;
  text-align:center;
  color:var(--gris);
  font-weight:700;
}

.error{
  background:#fff1f1;
  border:1px solid #efb4b4;
  border-radius:15px;
  padding:18px;
  text-align:center;
  color:#a20d0d;
  font-weight:700;
  line-height:1.5;
}

.estado{
  text-align:center;
  color:var(--gris);
  font-size:12px;
  margin-top:15px;
}

.pie{
  margin-top:28px;
  padding-top:17px;
  border-top:1px solid var(--linea);
  text-align:center;
  font-size:12px;
  color:#728498;
  line-height:1.6;
}

@media(max-width:480px){

  h1{
    font-size:27px;
  }

  .valor{
    font-size:17px;
  }

  .boton{
    font-size:14px;
  }

}

</style>

</head>


<body>

<div class="contenedor">


  <!-- LOGO -->

  <div class="logo">

    <svg
      viewBox="0 0 420 120"
      xmlns="http://www.w3.org/2000/svg"
      aria-label="GEXSA SOLUTIONS"
    >

      <text
        x="210"
        y="65"
        text-anchor="middle"
        font-family="Arial"
        font-size="58"
        font-weight="900"
        fill="#0b4d7c"
      >
        GEXSA
      </text>

      <text
        x="210"
        y="92"
        text-anchor="middle"
        font-family="Arial"
        font-size="18"
        font-weight="700"
        fill="#0b4d7c"
        letter-spacing="7"
      >
        SOLUTIONS
      </text>

    </svg>

  </div>


  <div class="badge">
    FICHA DIGITAL DEL EXTINTOR
  </div>


  <div id="contenido">

    <div class="cargando">
      Cargando información del extintor...
    </div>

  </div>


  <div class="pie">

    GEXSA SOLUTIONS E.I.R.L.<br>

    Sistema Digital de Control de Extintores

  </div>


</div>


<script>

/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbxEatAlgJhB9zwwYlbHRabB2Wm0sskzKMC3EZApl7QU4TifIom8lfAaDATkFVvoZVy4Xg/exec';


const TARJETA_BASE_URL =
'https://script.google.com/macros/s/AKfycbxEatAlgJhB9zwwYlbHRabB2Wm0sskzKMC3EZApl7QU4TifIom8lfAaDATkFVvoZVy4Xg/exec';


/* =====================================================
   SERIE DEL QR
   ===================================================== */

const parametros =
new URLSearchParams(
  window.location.search
);


const serieQR =
parametros.get('serie');


const contenido =
document.getElementById(
  'contenido'
);


/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function esc(
  valor
){

  if(
    valor === null ||
    valor === undefined
  ){

    return '';

  }


  return String(
    valor
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}


/* =====================================================
   OBTENER SERIE FINAL
   ===================================================== */

function serieFinal(
  valor
){

  if(!valor){

    return '';

  }


  const texto =
    String(
      valor
    ).trim();


  if(
    texto.indexOf('/') >= 0
  ){

    const partes =
      texto.split('/');


    return (
      partes[
        partes.length - 1
      ] || ''
    ).trim();

  }


  return texto;

}


/* =====================================================
   MOSTRAR ERROR
   ===================================================== */

function mostrarError(
  mensaje
){

  contenido.innerHTML = `

    <div class="error">

      ${esc(mensaje)}

    </div>

  `;

}


/* =====================================================
   BOTÓN
   ===================================================== */

function boton(
  texto,
  url
){

  if(!url){

    return `

      <div class="boton boton-deshabilitado">

        <span class="icono">
          ▣
        </span>

        <span class="texto-boton">
          ${esc(texto)}
        </span>

        <span class="flecha">
          ›
        </span>

      </div>

    `;

  }


  return `

    <a
      class="boton"
      href="${esc(url)}"
      target="_blank"
      rel="noopener noreferrer"
    >

      <span class="icono">
        ▣
      </span>

      <span class="texto-boton">
        ${esc(texto)}
      </span>

      <span class="flecha">
        ›
      </span>

    </a>

  `;

}


/* =====================================================
   MOSTRAR FICHA
   ===================================================== */

function mostrarFicha(
  data
){

  if(
    !data ||
    data.ok !== true ||
    !data.operatividad
  ){

    mostrarError(
      'No se encontró información para este extintor.'
    );

    return;

  }


  const op =
    data.operatividad;


  const cph =
    data.hidrostatica;


  const numero =
    op.numeroExtintor || '';


  const ubicacion =
    op.ubicacionSerie ||
    serieQR ||
    '';


  const serie =
    serieFinal(
      ubicacion
    );


  const cliente =
    op.cliente || '';


  const tipo =
    op.tipo || '';


  const capacidad =
    op.capacidad || '';


  const agente =
    op.agenteClase || '';


  const direccion =
    op.direccion || '';


  const codigo =
    op.codigoCertificado || '';


  const fabricacion =
    op.fabricacion || '';


  const carga =
    op.fechaCarga || '';


  const vencimiento =
    op.fechaVencimiento || '';


  const ph =
    op.ph || '';


  /*
     ================================================
     BOTÓN TARJETA
     ================================================
  */

  const urlTarjeta =
    TARJETA_BASE_URL +
    '?accion=tarjeta&serie=' +
    encodeURIComponent(
      ubicacion
    );


  let html = '';


  html += `

    <h1>
      Extintor N.º
      ${esc(numero)}
    </h1>

  `;


  html += `

    <div class="serie">

      N.º DE SERIE:
      ${esc(serie)}

    </div>

  `;


  html += `

    <div class="ficha">

  `;


  /* CLIENTE */

  html += `

    <div class="fila">

      <div class="etiqueta">
        Cliente
      </div>

      <div class="valor">
        ${esc(cliente)}
      </div>

    </div>

  `;


  /* TIPO */

  if(tipo){

    html += `

      <div class="fila">

        <div class="etiqueta">
          Tipo de extintor
        </div>

        <div class="valor">
          ${esc(tipo)}
        </div>

      </div>

    `;

  }


  /* CAPACIDAD */

  if(capacidad){

    html += `

      <div class="fila">

        <div class="etiqueta">
          Capacidad
        </div>

        <div class="valor">
          ${esc(capacidad)}
        </div>

      </div>

    `;

  }


  /* AGENTE */

  if(agente){

    html += `

      <div class="fila">

        <div class="etiqueta">
          Agente / Clase
        </div>

        <div class="valor">
          ${esc(agente)}
        </div>

      </div>

    `;

  }


  /* UBICACIÓN */

  if(ubicacion){

    html += `

      <div class="fila">

        <div class="etiqueta">
          Ubicación / Serie
        </div>

        <div class="valor">
          ${esc(ubicacion)}
        </div>

      </div>

    `;

  }


  /* DIRECCIÓN */

  if(direccion){

    html += `

      <div class="fila">

        <div class="etiqueta">
          Dirección
        </div>

        <div class="valor">
          ${esc(direccion)}
        </div>

      </div>

    `;

  }


  /* CÓDIGO */

  if(codigo){

    html += `

      <div class="fila">

        <div class="etiqueta">
          Código de certificado
        </div>

        <div class="valor">
          ${esc(codigo)}
        </div>

      </div>

    `;

  }


  /* FABRICACIÓN */

  if(fabricacion){

    html += `

      <div class="fila">

        <div class="etiqueta">
          Fecha de fabricación
        </div>

        <div class="valor">
          ${esc(fabricacion)}
        </div>

      </div>

    `;

  }


  /* CARGA */

  if(carga){

    html += `

      <div class="fila">

        <div class="etiqueta">
          Fecha de carga
        </div>

        <div class="valor">
          ${esc(carga)}
        </div>

      </div>

    `;

  }


  /* VENCIMIENTO */

  if(vencimiento){

    html += `

      <div class="fila">

        <div class="etiqueta">
          Fecha de vencimiento
        </div>

        <div class="valor">
          ${esc(vencimiento)}
        </div>

      </div>

    `;

  }


  /* PRÓXIMA PH */

  if(ph){

    html += `

      <div class="fila">

        <div class="etiqueta">
          Próxima prueba hidrostática
        </div>

        <div class="valor">
          ${esc(ph)}
        </div>

      </div>

    `;

  }


  html += `

    </div>

  `;


  /* =================================================
     3 BOTONES
     ================================================= */

  html += boton(
    'Certificado de operatividad',
    op.pdf || ''
  );


  html += boton(
    'Certificado de prueba hidrostática',
    cph && cph.pdf
      ? cph.pdf
      : ''
  );


  html += boton(
    'Tarjeta de inspección',
    urlTarjeta
  );


  html += `

    <div class="estado">
      Ficha consultada automáticamente
    </div>

  `;


  contenido.innerHTML =
    html;

}


/* =====================================================
   CARGAR API
   ===================================================== */

function cargar(){

  if(!serieQR){

    mostrarError(
      'No se recibió la UBICACIÓN / SERIE del código QR.'
    );

    return;

  }


  const callback =
    'gexsaQRCallback';


  window[callback] =
    function(data){

      mostrarFicha(
        data
      );

    };


  const script =
    document.createElement(
      'script'
    );


  script.src =
    API_URL +
    '?serie=' +
    encodeURIComponent(
      serieQR
    ) +
    '&callback=' +
    callback;


  script.onerror =
    function(){

      mostrarError(
        'No se pudo conectar con el sistema digital de GEXSA SOLUTIONS.'
      );

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   INICIAR
   ===================================================== */

cargar();

</script>

</body>

</html>
