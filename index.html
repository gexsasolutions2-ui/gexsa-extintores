<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GEXSA SOLUTIONS | Ficha Digital</title>

<style>

:root{
  --blue:#0f5d98;
  --navy:#18324f;
  --red:#ef111b;
  --light:#eef3f7;
  --line:#dbe3ea;
  --gray:#6f8192;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#fff;
  color:var(--navy);
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:620px;
  margin:0 auto;
  padding:24px 18px 34px;
}

.card{
  width:100%;
}

.logo-img{
  display:block;
  width:220px;
  max-width:68%;
  height:auto;
  margin:0 auto 6px;
}

.badge{
  display:block;
  width:max-content;
  max-width:100%;
  margin:18px auto 20px;
  padding:8px 14px;
  border-radius:999px;
  background:#e9f3fb;
  color:#116197;
  font-size:13px;
  font-weight:700;
}

h1{
  text-align:center;
  margin:12px 0 8px;
  font-size:30px;
  color:#102f4d;
}

.subtitle{
  text-align:center;
  margin:0 0 26px;
  color:var(--gray);
  font-size:15px;
  font-weight:700;
}

.data{
  background:var(--light);
  border-radius:18px;
  padding:16px 18px;
  margin-bottom:22px;
}

.row{
  padding:10px 0;
  border-bottom:1px solid var(--line);
}

.row:last-child{
  border-bottom:0;
}

.label{
  font-size:12px;
  text-transform:uppercase;
  color:var(--gray);
  margin-bottom:3px;
}

.value{
  font-size:18px;
  font-weight:700;
  line-height:1.25;
  overflow-wrap:anywhere;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  width:100%;
  padding:18px 18px;
  margin:14px 0;
  border-radius:14px;
  background:var(--red);
  color:#fff;
  text-decoration:none;
  font-size:15px;
  font-weight:800;
  text-transform:uppercase;
  cursor:pointer;
}

.btn.disabled{
  opacity:.45;
  cursor:not-allowed;
}

.icon{
  font-size:23px;
  line-height:1;
}

.arrow{
  margin-left:auto;
  font-size:28px;
  font-weight:400;
}

.estado{
  text-align:center;
  margin:18px 0;
  font-size:13px;
  color:var(--gray);
}

.footer{
  margin-top:28px;
  padding-top:18px;
  border-top:1px solid var(--line);
  text-align:center;
  color:#728498;
  font-size:12px;
  line-height:1.6;
}

.loading{
  text-align:center;
  padding:30px 10px;
  color:var(--gray);
  font-size:15px;
}

.error{
  background:#fff1f1;
  border:1px solid #f3b9b9;
  color:#a10d0d;
  border-radius:14px;
  padding:16px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
}

</style>
</head>


<body>

<div class="wrap">

  <div class="card">

    <!-- LOGO -->
    <img
      class="logo-img"
      src="logo-gexsa.png"
      alt="GEXSA SOLUTIONS"
    >

    <div class="badge">
      FICHA DIGITAL DEL EXTINTOR
    </div>

    <!-- CONTENIDO DINÁMICO -->
    <div id="contenido">

      <div class="loading">
        Cargando información del extintor...
      </div>

    </div>

    <div class="footer">
      GEXSA SOLUTIONS E.I.R.L.<br>
      Sistema Digital de Control de Extintores
    </div>

  </div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbw0lR7PwZtTFdRnBaM8VCy1sPGpW0bKEpP4DNZwsmi86YiKYFboPHx8UT-kf2rkKvQ3kQ/exec';


const TARJETA_URL =
  'https://docs.google.com/spreadsheets/d/1jTt8KdQhbbv6nwXtk2mJDI6du_Sq2sWVYlScaTcIJ7M/edit?gid=66323689#gid=66323689';


/* =====================================================
   OBTENER SERIE DEL QR
   ===================================================== */

const parametros =
  new URLSearchParams(
    window.location.search
  );

const serieQR =
  parametros.get('serie');


/* =====================================================
   REFERENCIA AL CONTENEDOR
   ===================================================== */

const contenido =
  document.getElementById(
    'contenido'
  );


/* =====================================================
   FORMATEAR SERIE
   ===================================================== */

function formatearSerie(valor){

  if(!valor){
    return '';
  }

  const texto =
    String(valor).trim();

  /*
     Si es solamente numérico
     y tiene menos de 6 dígitos,
     completar con ceros.
  */

  if(
    /^\d+$/.test(texto) &&
    texto.length < 6
  ){

    return texto.padStart(
      6,
      '0'
    );

  }

  return texto;
}


/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function escaparHTML(valor){

  if(
    valor === null ||
    valor === undefined
  ){

    return '';

  }

  return String(valor)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* =====================================================
   MOSTRAR ERROR
   ===================================================== */

function mostrarError(mensaje){

  contenido.innerHTML = `
    <div class="error">
      ${escaparHTML(mensaje)}
    </div>
  `;

}


/* =====================================================
   CARGAR FICHA
   ===================================================== */

function cargarFicha(){

  if(!serieQR){

    mostrarError(
      'No se encontró la UBICACIÓN / SERIE del extintor en el código QR.'
    );

    return;

  }


  /*
     JSONP

     Se utiliza porque la página está en GitHub
     y la API está en Google Apps Script.
  */

  const nombreCallback =
    'gexsaCallback_' +
    Date.now();


  window[nombreCallback] =
    function(respuesta){

      try{

        procesarRespuesta(
          respuesta
        );

      }finally{

        delete window[nombreCallback];

        const script =
          document.getElementById(
            nombreCallback
          );

        if(script){

          script.remove();

        }

      }

    };


  const script =
    document.createElement(
      'script'
    );


  script.id =
    nombreCallback;


  script.src =
    API_URL +
    '?serie=' +
    encodeURIComponent(
      serieQR
    ) +
    '&callback=' +
    encodeURIComponent(
      nombreCallback
    );


  script.onerror =
    function(){

      mostrarError(
        'No se pudo conectar con el sistema digital de GEXSA SOLUTIONS.'
      );

      delete window[nombreCallback];

      script.remove();

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   PROCESAR RESPUESTA
   ===================================================== */

function procesarRespuesta(
  respuesta
){

  if(
    !respuesta ||
    !respuesta.ok ||
    !respuesta.operatividad
  ){

    const mensaje =
      respuesta &&
      respuesta.error
        ? respuesta.error
        : 'No se encontró información para este extintor.';

    mostrarError(
      mensaje
    );

    return;

  }


  const op =
    respuesta.operatividad;


  const cph =
    respuesta.hidrostatica;


  /* ===================================================
     DATOS DEL EXTINTOR
     =================================================== */

  const numero =
    op.numeroExtintor ||
    '';


  const serieCompleta =
    formatearSerie(
      op.ubicacionSerie ||
      serieQR
    );


  const serieSolo =
    formatearSerie(
      obtenerSerieFinal(
        op.ubicacionSerie ||
        serieQR
      )
    );


  const cliente =
    op.cliente ||
    '';


  const capacidad =
    op.capacidad ||
    '';


  const agente =
    op.agenteClase ||
    op.tipo ||
    '';


  const ubicacion =
    op.ubicacionSerie ||
    serieQR;


  const fechaFabricacion =
    op.fabricacion ||
    '';


  const fechaCarga =
    op.fechaCarga ||
    '';


  const fechaVencimiento =
    op.fechaVencimiento ||
    '';


  const ph =
    op.ph ||
    '';


  const codigoCertificado =
    op.codigoCertificado ||
    '';


  /* ===================================================
     PDF OPERATIVIDAD
     =================================================== */

  let botonOperatividad = '';


  if(op.pdf){

    botonOperatividad = `
      <a
        class="btn"
        href="${escaparHTML(op.pdf)}"
        target="_blank"
        rel="noopener"
      >
        <span class="icon">▣</span>
        <span>Certificado de operatividad</span>
        <span class="arrow">›</span>
      </a>
    `;

  }else{

    botonOperatividad = `
      <div
        class="btn disabled"
        aria-label="Certificado de operatividad no disponible"
      >
        <span class="icon">▣</span>
        <span>Certificado de operatividad</span>
        <span class="arrow">›</span>
      </div>
    `;

  }


  /* ===================================================
     PDF HIDROSTÁTICA
     =================================================== */

  let botonHidrostatica = '';


  if(
    cph &&
    cph.pdf
  ){

    botonHidrostatica = `
      <a
        class="btn"
        href="${escaparHTML(cph.pdf)}"
        target="_blank"
        rel="noopener"
      >
        <span class="icon">▣</span>
        <span>Certificado de prueba hidrostática</span>
        <span class="arrow">›</span>
      </a>
    `;

  }else{

    botonHidrostatica = `
      <div
        class="btn disabled"
        aria-label="Certificado de prueba hidrostática no disponible"
      >
        <span class="icon">▣</span>
        <span>Certificado de prueba hidrostática</span>
        <span class="arrow">›</span>
      </div>
    `;

  }


  /* ===================================================
     TARJETA
     =================================================== */

  const botonTarjeta = `
    <a
      class="btn"
      href="${TARJETA_URL}"
      target="_blank"
      rel="noopener"
    >
      <span class="icon">▣</span>
      <span>Tarjeta de inspección</span>
      <span class="arrow">›</span>
    </a>
  `;


  /* ===================================================
     MOSTRAR INFORMACIÓN
     =================================================== */

  contenido.innerHTML = `

    <h1>
      Extintor N.º ${escaparHTML(numero)}
    </h1>

    <div class="subtitle">
      N.º DE SERIE: ${escaparHTML(serieSolo)}
    </div>


    <div class="data">

      <div class="row">
        <div class="label">
          Cliente
        </div>
        <div class="value">
          ${escaparHTML(cliente)}
        </div>
      </div>


      <div class="row">
        <div class="label">
          Tipo de extintor
        </div>
        <div class="value">
          ${escaparHTML(op.tipo || '')}
        </div>
      </div>


      <div class="row">
        <div class="label">
          Capacidad
        </div>
        <div class="value">
          ${escaparHTML(capacidad)}
        </div>
      </div>


      <div class="row">
        <div class="label">
          Agente / Clase
        </div>
        <div class="value">
          ${escaparHTML(agente)}
        </div>
      </div>


      <div class="row">
        <div class="label">
          Ubicación / Serie
        </div>
        <div class="value">
          ${escaparHTML(ubicacion)}
        </div>
      </div>


      <div class="row">
        <div class="label">
          Dirección
        </div>
        <div class="value">
          ${escaparHTML(op.direccion || '')}
        </div>
      </div>


      ${
        codigoCertificado
        ? `
          <div class="row">
            <div class="label">
              Código de certificado
            </div>
            <div class="value">
              ${escaparHTML(codigoCertificado)}
            </div>
          </div>
        `
        : ''
      }


      ${
        fechaFabricacion
        ? `
          <div class="row">
            <div class="label">
              Fecha de fabricación
            </div>
            <div class="value">
              ${escaparHTML(fechaFabricacion)}
            </div>
          </div>
        `
        : ''
      }


      ${
        fechaCarga
        ? `
          <div class="row">
            <div class="label">
              Fecha de carga
            </div>
            <div class="value">
              ${escaparHTML(fechaCarga)}
            </div>
          </div>
        `
        : ''
      }


      ${
        fechaVencimiento
        ? `
          <div class="row">
            <div class="label">
              Fecha de vencimiento
            </div>
            <div class="value">
              ${escaparHTML(fechaVencimiento)}
            </div>
          </div>
        `
        : ''
      }


      ${
        ph
        ? `
          <div class="row">
            <div class="label">
              Próxima prueba hidrostática
            </div>
            <div class="value">
              ${escaparHTML(ph)}
            </div>
          </div>
        `
        : ''
      }

    </div>


    ${botonOperatividad}

    ${botonHidrostatica}

    ${botonTarjeta}

  `;

}


/* =====================================================
   EXTRAER SERIE FINAL
   ===================================================== */

function obtenerSerieFinal(
  valor
){

  const texto =
    String(
      valor || ''
    ).trim();


  if(
    texto.includes('/')
  ){

    const partes =
      texto.split('/');


    return (
      partes[
        partes.length - 1
      ] || ''
    ).trim();

  }


  return texto;

}


/* =====================================================
   INICIAR
   ===================================================== */

cargarFicha();

</script>

</body>
</html>
